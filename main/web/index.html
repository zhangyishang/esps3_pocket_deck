<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 文件管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
     background:#0f1620;color:#e8eef5;font-size:15px}
header{padding:12px 14px;background:#172231;position:sticky;top:0;z-index:9;
       border-bottom:1px solid #22303f}
h1{margin:0;font-size:17px;font-weight:600}
#path{margin-top:6px;color:#7fb3e0;font-size:13px;word-break:break-all}
.bar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap;align-items:center}
button{background:#1f2e3f;color:#dfe9f3;border:1px solid #2f4358;border-radius:8px;
       padding:8px 12px;font-size:14px}
button:active{background:#2a3d52}
button.danger{border-color:#5a2f36;color:#ff9aa0}
ul{list-style:none;margin:0;padding:0 14px 20px}
li{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:8px;
   background:#16202c;margin-bottom:8px}
li .ico{font-size:18px;width:22px;text-align:center}
li .nm{flex:1;word-break:break-all}
li .sz{color:#7d93a8;font-size:12px;white-space:nowrap}
li .op{display:flex;gap:6px}
li .op button{padding:5px 9px;font-size:13px}
#info{padding:0 14px 24px;color:#7d93a8;font-size:13px}
#log{padding:0 14px 24px;color:#9ecbff;font-size:13px;white-space:pre-wrap}
progress{width:100%;height:6px}
</style>
</head>
<body>
<header>
  <h1>ESP32 文件管理</h1>
  <div id="path">/</div>
</header>

<div class="bar">
  <button onclick="up()">↑ 上级</button>
  <button onclick="refresh()">刷新</button>
  <button onclick="doMkdir()">新建文件夹</button>
</div>
<div class="bar">
  <input type="file" id="file" multiple style="flex:1;min-width:160px;color:#a9bccf">
  <button onclick="doUpload()">上传</button>
</div>
<progress id="pg" value="0" max="100" style="display:none"></progress>
<div id="log"></div>

<ul id="list"></ul>
<div id="info"></div>

<script>
let cur = "/sdcard";

function q(p){ return encodeURIComponent(p); }
function fmt(n){
  if(n>=1048576) return (n/1048576).toFixed(1)+" MB";
  if(n>=1024) return Math.round(n/1024)+" KB";
  return n+" B";
}
function log(s){ document.getElementById("log").textContent = s || ""; }

async function refresh(){
  try{
    const r = await fetch("/api/list?path=" + q(cur));
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    document.getElementById("path").textContent = j.path;
    document.getElementById("info").textContent =
      "剩余空间 " + fmt(j.free_bytes || 0);

    const ul = document.getElementById("list");
    ul.innerHTML = "";
    (j.items || []).forEach(it=>{
      const li = document.createElement("li");
      const isDir = it.type === "dir";
      li.innerHTML =
        '<span class="ico">' + (isDir ? "📁" : icon(it.name)) + '</span>' +
        '<span class="nm"></span>' +
        '<span class="sz">' + (isDir ? "" : fmt(it.size)) + '</span>';
      li.querySelector(".nm").textContent = it.name;

      const op = document.createElement("span");
      op.className = "op";
      if(isDir){
        const b = document.createElement("button");
        b.textContent = "打开";
        b.onclick = ()=>{ cur = j.path.replace(/\/$/,"") + "/" + it.name; refresh(); };
        op.appendChild(b);
      }else{
        const b = document.createElement("button");
        b.textContent = "下载";
        b.onclick = ()=>{ location.href = "/dl?path=" + q(j.path.replace(/\/$/,"") + "/" + it.name); };
        op.appendChild(b);
      }
      const d = document.createElement("button");
      d.textContent = "删除";
      d.className = "danger";
      d.onclick = ()=>doDelete(j.path.replace(/\/$/,"") + "/" + it.name);
      op.appendChild(d);
      li.appendChild(op);
      ul.appendChild(li);
    });
    if((j.items || []).length === 0){
      ul.innerHTML = '<li style="justify-content:center;color:#7d93a8">空目录</li>';
    }
  }catch(e){
    log("读取失败：" + e.message);
  }
}

function icon(n){
  const s = n.toLowerCase();
  if(s.endsWith(".jpg")||s.endsWith(".jpeg")||s.endsWith(".png")) return "🖼️";
  if(s.endsWith(".mp3")) return "🎵";
  return "📄";
}

function up(){
  const i = cur.lastIndexOf("/");
  if(i <= 0) return;
  cur = cur.slice(0, i) || "/";
  if(cur.length < 6) cur = "/sdcard";
  refresh();
}

async function doDelete(p){
  if(!confirm("确定删除？\n" + p)) return;
  try{
    const r = await fetch("/api/delete?path=" + q(p), {method:"DELETE"});
    log(r.ok ? "已删除 " + p : "删除失败 HTTP " + r.status);
  }catch(e){ log("删除失败：" + e.message); }
  refresh();
}

async function doMkdir(){
  const name = prompt("新文件夹名字");
  if(!name) return;
  try{
    const r = await fetch("/api/mkdir?path=" + q(cur.replace(/\/$/,"") + "/" + name),
                          {method:"POST"});
    log(r.ok ? "已创建" : "创建失败 HTTP " + r.status);
  }catch(e){ log("创建失败：" + e.message); }
  refresh();
}

async function doUpload(){
  const files = document.getElementById("file").files;
  if(!files.length){ log("先选文件"); return; }
  const pg = document.getElementById("pg");
  pg.style.display = "block";

  for(let i=0;i<files.length;i++){
    const f = files[i];
    const url = "/api/upload?path=" + q(cur.replace(/\/$/,"")) + "&name=" + q(f.name);
    try{
      log("上传中 (" + (i+1) + "/" + files.length + ") " + f.name);
      const r = await fetch(url, {method:"PUT", body:f});
      log(r.ok ? "已上传 " + f.name : "上传失败 " + f.name + " HTTP " + r.status);
    }catch(e){ log("上传失败：" + e.message); }
    pg.value = Math.round((i+1)*100/files.length);
  }
  pg.style.display = "none";
  document.getElementById("file").value = "";
  refresh();
}

refresh();
</script>
</body>
</html>
