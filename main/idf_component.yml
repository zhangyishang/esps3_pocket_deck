## IDF Component Manager Manifest File
dependencies:
  espressif/esp32-camera: "^2.1.4"         # 摄像头驱动
  lvgl/lvgl: "~8.3.0"
  espressif/esp_lvgl_port: "~1.4.0"         # LVGL接口
  espressif/esp_lcd_touch_ft5x06: "~1.0.7"  # 触摸屏驱动
  # 音频播放器：**改成了用项目里的副本**（components/chmorgan__esp-audio-player）。
  # 原因见 components/chmorgan__esp-audio-player/audio_mp3.cpp 里 is_mp3() 开头的补丁：
  # 上游每次播放都会把文件位置强制回 0，导致"从中间定位播放"做不到。
  # override_path 是组件管理器官方支持的本地覆盖机制；路径相对本文件所在目录解析。
  # 想回到上游版本：删掉这两行 override_path、并把 components/ 下那个目录删掉即可。
  chmorgan/esp-audio-player:
    version: "~1.0.7"
    override_path: "../components/chmorgan__esp-audio-player"
  chmorgan/esp-file-iterator: "1.0.0"       # 获取文件
  espressif/esp_codec_dev: "~1.3.0"         # 音频驱动
  espressif/esp-sr: "~1.6.0"                # 语音识别（目前未使用，保留以便将来加唤醒词）
  # Opus 编解码 —— 小智协议规定音频必须是 Opus（16k 单声道），官方服务端只收这个格式。
  # 这是 78 维护的 libopus 封装，xiaozhi-esp32 官方用的就是它。
  78/esp-opus: "^1.0.5"
  ## Required IDF version
  # idf:
  #   version: ">=4.1.0"
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
